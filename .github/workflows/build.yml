name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -ldflags="-s -w" -o xlsx2grand-linux-${{ matrix.arch }} ./cmd/xlsx2grand

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xlsx2grand-linux-${{ matrix.arch }}
          path: xlsx2grand-linux-${{ matrix.arch }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t xlsx2grand:ci .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xlsx2grand-linux-*
